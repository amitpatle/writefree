<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" font-family="'JetBrains Mono','DejaVu Sans Mono',Consolas,'Courier New',monospace" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="1200" height="560" fill="#000"/>
<defs><pattern id="s" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity="0.04"/></pattern></defs>
<rect width="1200" height="560" fill="url(#s)"/>
<rect x="12" y="12" width="1176" height="536" fill="none" stroke="#fff" stroke-width="2"/>
<text x="50" y="70" fill="#8a8a8a" font-size="18">$ ./contribute.sh</text>
<text x="50" y="125" fill="#fff" font-size="46" font-weight="700" letter-spacing="3">HOW TO CONTRIBUTE<tspan dx="10">█</tspan></text>

<rect x="40" y="175" width="250" height="250" fill="#000" stroke="#fff" stroke-width="2"/>
<text x="60" y="225" fill="#8a8a8a" font-size="34" font-weight="700">01</text>
<text x="60" y="265" fill="#fff" font-size="21" font-weight="700" letter-spacing="1">FORK</text>
<line x1="60" y1="280" x2="270" y2="280" stroke="#8a8a8a" stroke-width="1"/>
<text x="60" y="313" fill="#fff" font-size="16">Fork the repo</text>
<text x="60" y="369" fill="#fff" font-size="16">$ gh repo fork</text>
<text x="60" y="397" fill="#8a8a8a" font-size="16">amitpatle/writefree</text>
<text x="296" y="310" fill="#fff" font-size="28" font-weight="700">&gt;</text>
<rect x="330" y="175" width="250" height="250" fill="#000" stroke="#fff" stroke-width="2"/>
<text x="350" y="225" fill="#8a8a8a" font-size="34" font-weight="700">02</text>
<text x="350" y="265" fill="#fff" font-size="21" font-weight="700" letter-spacing="1">ADD</text>
<line x1="350" y1="280" x2="560" y2="280" stroke="#8a8a8a" stroke-width="1"/>
<text x="350" y="313" fill="#fff" font-size="16">Edit resources.json</text>
<text x="350" y="369" fill="#8a8a8a" font-size="16">{ name: ...,</text>
<text x="350" y="397" fill="#8a8a8a" font-size="16">  url: ... }</text>
<text x="586" y="310" fill="#fff" font-size="28" font-weight="700">&gt;</text>
<rect x="620" y="175" width="250" height="250" fill="#000" stroke="#fff" stroke-width="2"/>
<text x="640" y="225" fill="#8a8a8a" font-size="34" font-weight="700">03</text>
<text x="640" y="265" fill="#fff" font-size="21" font-weight="700" letter-spacing="1">PULL REQUEST</text>
<line x1="640" y1="280" x2="850" y2="280" stroke="#8a8a8a" stroke-width="1"/>
<text x="640" y="313" fill="#fff" font-size="16">Open a pull request</text>
<text x="640" y="369" fill="#fff" font-size="16">$ git push</text>
<text x="640" y="397" fill="#8a8a8a" font-size="16">title: add &lt;name&gt;</text>
<text x="876" y="310" fill="#fff" font-size="28" font-weight="700">&gt;</text>
<rect x="910" y="175" width="250" height="250" fill="#fff" stroke="#fff" stroke-width="2"/>
<text x="930" y="225" fill="#444" font-size="34" font-weight="700">04</text>
<text x="930" y="265" fill="#000" font-size="21" font-weight="700" letter-spacing="1">MERGED</text>
<line x1="930" y1="280" x2="1140" y2="280" stroke="#444" stroke-width="1"/>
<text x="930" y="313" fill="#000" font-size="16">Reviewed + merged</text>
<text x="930" y="369" fill="#000" font-size="16">link-check: PASS</text>
<text x="930" y="397" fill="#444" font-size="16">live on the site</text>
<line x1="40" y1="460" x2="1160" y2="460" stroke="#3a3a3a" stroke-dasharray="6 6"/>
<text x="40" y="496" fill="#fff" font-size="17" font-weight="700">NO TIME? OPEN A SUGGESTION ISSUE</text>
<text x="40" y="522" fill="#8a8a8a" font-size="15">github.com/amitpatle/writefree/issues</text>
<text x="1160" y="496" text-anchor="end" fill="#fff" font-size="15" font-weight="700">RULES</text>
<text x="1160" y="522" text-anchor="end" fill="#8a8a8a" font-size="15">FREE ONLY | NO AFFILIATE LINKS | NO DUPLICATES | NO DEAD LINKS</text>
</svg>